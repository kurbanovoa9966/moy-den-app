plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.otabek.moyden'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.otabek.moyden'
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
